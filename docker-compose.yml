services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campaign_iq
      POSTGRES_USER: campaign_iq
      POSTGRES_PASSWORD: campaign_iq
    ports:
      - "5432:5432"
    volumes:
      - campaign_iq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign_iq -d campaign_iq"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-campaign_iq}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-campaign-iq-local-storage-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - campaign_iq_objects:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://object-storage:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}";
      mc mb --ignore-existing local/$${S3_BUCKET};
      '
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-campaign_iq}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-campaign-iq-local-storage-secret}
      S3_BUCKET: ${S3_BUCKET:-campaigniq-raw}

volumes:
  campaign_iq_postgres:
  campaign_iq_objects:
